name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Pinned rather than macos-latest so runner migrations don't change the toolchain silently.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift build
      - run: swift test
      # CI links a newer SDK than local SwiftPM builds record, which can change AppKit behavior
      # (v0.1.0 crashed at launch only when built here), so launch what CI built.
      - name: Launch smoke test
        run: ./scripts/smoke-test.sh "$(swift build --show-bin-path)/MacDirStat"
